<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Halaman Tidak Ditemukan | Think Aset</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" id="favicon-link" />
  <style>
    :root {
      --primary: #16A34A;
      --primary-dark: #166534;
      --primary-light: #DCFCE7;
      --primary-faint: #F0FDF4;
      --surface: #FFFFFF;
      --bg-page: #F9FAFB;
      --text: #111827;
      --text-muted: #6B7280;
      --border: #E5E7EB;
      --accent-amber: #F59E0B;
      --accent-danger: #DC2626;
      --accent-danger-bg: #FEE2E2;
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text);
      background:
        radial-gradient(circle at 0% 0%, var(--primary-faint), transparent 42%),
        radial-gradient(circle at 100% 100%, var(--primary-light), transparent 42%),
        var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
    }

    .wrap {
      width: 100%;
      max-width: 680px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .mode-bar {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(17, 24, 39, 0.05);
    }

    .mode-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    }
    .mode-btn:hover {
      background: var(--primary-faint);
      color: var(--primary-dark);
    }
    .mode-btn.active {
      background: var(--primary-light);
      color: var(--primary-dark);
      border-color: var(--primary);
    }
    .mode-kbd {
      font-size: 10px;
      opacity: 0.7;
    }

    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(17, 24, 39, 0.06), 0 1px 4px rgba(22, 163, 74, 0.08);
      text-align: center;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-faint);
      border: 1px solid var(--primary-light);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    .status-dot.warning { background: var(--accent-amber); box-shadow: 0 0 0 3px #FEF3C7; }
    .status-dot.danger  { background: var(--accent-danger); box-shadow: 0 0 0 3px var(--accent-danger-bg); }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
    }
    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }

    .illustration {
      width: 190px;
      height: 170px;
      margin: 0 auto 4px;
    }

    .code-num {
      font-family: var(--font-mono);
      font-size: clamp(2.8rem, 8vw, 4.25rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--primary-dark);
      margin: 0 0 8px;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 800;
      margin: 0 0 8px;
      color: var(--text);
    }

    .desc {
      font-size: 14.5px;
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto 18px;
      line-height: 1.55;
    }

    .diag-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      max-width: 520px;
      margin: 0 auto 18px;
      padding: 10px 12px;
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      text-align: left;
    }

    .diag-cmd {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 120ms ease, background 150ms ease, border-color 150ms ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary {
      background: var(--primary-faint);
      color: var(--primary-dark);
      border-color: var(--primary-light);
    }
    .btn-secondary:hover { border-color: var(--primary); }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border);
    }
    .btn-ghost:hover {
      background: var(--bg-page);
      color: var(--text);
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding-top: 14px;
      font-family: var(--font-mono);
    }
    footer a {
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 600;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mode-bar" role="tablist" aria-label="Mode status error">
      <button type="button" class="mode-btn" data-err-mode="404"><span class="mode-kbd">F1</span> 404</button>
      <button type="button" class="mode-btn" data-err-mode="403"><span class="mode-kbd">F2</span> 403</button>
      <button type="button" class="mode-btn" data-err-mode="500"><span class="mode-kbd">F3</span> 500</button>
      <button type="button" class="mode-btn" data-err-mode="503"><span class="mode-kbd">F4</span> 503</button>
    </div>

    <section class="card">
      <div class="card-top">
        <div class="status-pill">
          <span class="status-dot" id="ep-dot"></span>
          <span id="ep-badge">HTTP_STATUS: 404_NOT_FOUND</span>
        </div>
        <a href="index.html" id="brandLink" class="brand">
          <img src="icons/icon.svg" id="brandIcon" alt="Think Aset" />
          <span>Think Aset</span>
        </a>
      </div>

      <div class="illustration" id="ep-illustration"></div>
      <h1 class="code-num" id="ep-code">404</h1>
      <h2 class="title" id="ep-title">Halaman Tidak Ditemukan</h2>
      <p class="desc" id="ep-desc"></p>

      <div class="diag-bar">
        <span class="diag-cmd" id="ep-cmd"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="ep-copy">Salin</button>
      </div>

      <div class="actions">
        <a href="index.html" id="homeLink" class="btn btn-primary">Beranda</a>
        <a href="app.html#/dashboard" id="appLink" class="btn btn-secondary">Buka Aplikasi</a>
        <button type="button" class="btn btn-ghost" id="ep-back">← Kembali</button>
        <a href="https://github.com/jaiz-lana/think---aset" target="_blank" rel="noopener noreferrer" class="btn btn-ghost">GitHub ↗</a>
      </div>
    </section>
  </main>

  <footer>
    <span id="footerStatus">STATUS: 404</span> ·
    <a href="https://github.com/jaiz-lana/think---aset" target="_blank" rel="noopener noreferrer">Think Aset Open Source</a>
  </footer>

  <script>
    (function () {
      const basePath = window.location.pathname.startsWith('/think---aset') ? '/think---aset/' : '/';
      const setHref = (id, file) => {
        const el = document.getElementById(id);
        if (el) el.href = basePath + file;
      };
      setHref('favicon-link', 'icons/icon.svg');
      setHref('brandLink', 'index.html');
      setHref('homeLink', 'index.html');
      setHref('appLink', 'app.html#/dashboard');
      const brandIcon = document.getElementById('brandIcon');
      if (brandIcon) brandIcon.src = basePath + 'icons/icon.svg';

      const ILLUSTRATIONS = {
        '404': '<svg viewBox="0 0 220 190" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="110" cy="95" r="76" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/><circle cx="110" cy="95" r="62" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.45"/><rect x="64" y="60" width="84" height="68" rx="12" fill="#FFFFFF" stroke="#166534" stroke-width="2.4" stroke-dasharray="6 4"/><path d="M64 80h84" stroke="#DCFCE7" stroke-width="2"/><rect x="78" y="92" width="38" height="8" rx="4" fill="#DCFCE7"/><rect x="78" y="106" width="26" height="8" rx="4" fill="#E5E7EB"/><g transform="translate(118, 84)"><circle cx="24" cy="24" r="22" fill="#FFFFFF" stroke="#16A34A" stroke-width="3.2"/><circle cx="24" cy="24" r="15" fill="#F0FDF4"/><text x="24" y="31" text-anchor="middle" fill="#166534" font-family="monospace" font-size="20" font-weight="800">?</text><path d="M40 40l14 14" stroke="#166534" stroke-width="5" stroke-linecap="round"/></g></svg>',
        '403': '<svg viewBox="0 0 220 190" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="110" cy="95" r="76" fill="#FEF3C7" opacity="0.45"/><circle cx="110" cy="95" r="64" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/><path d="M110 38L158 56V96C158 128 137 150 110 160C83 150 62 128 62 96V56L110 38Z" fill="#F0FDF4" stroke="#166534" stroke-width="2.6"/><path d="M94 86V76a16 16 0 0 1 32 0v10" stroke="#166534" stroke-width="3.4" stroke-linecap="round"/><rect x="84" y="86" width="52" height="40" rx="9" fill="#16A34A" stroke="#166534" stroke-width="2.2"/><circle cx="110" cy="103" r="5" fill="#FFFFFF"/><path d="M110 107v9" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/></svg>',
        '500': '<svg viewBox="0 0 220 190" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="110" cy="95" r="76" fill="#FEE2E2" opacity="0.45"/><circle cx="110" cy="95" r="64" fill="#FFFFFF" stroke="#FECACA" stroke-width="2"/><rect x="58" y="48" width="104" height="32" rx="8" fill="#F9FAFB" stroke="#374151" stroke-width="2.2"/><circle cx="74" cy="64" r="4" fill="#16A34A"/><rect x="86" y="61" width="58" height="6" rx="3" fill="#D1D5DB"/><rect x="58" y="88" width="104" height="32" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/><circle cx="74" cy="104" r="4" fill="#DC2626"/><rect x="86" y="101" width="44" height="6" rx="3" fill="#FCA5A5"/><circle cx="146" cy="104" r="16" fill="#DC2626"/><path d="M146 96v9" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><circle cx="146" cy="111" r="2" fill="#FFFFFF"/><path d="M76 136h68" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/></svg>',
        '503': '<svg viewBox="0 0 220 190" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="110" cy="95" r="76" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/><g transform="translate(60, 52)"><circle cx="38" cy="38" r="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/><circle cx="38" cy="38" r="8" fill="#FFFFFF" stroke="#166534" stroke-width="2.5"/><path d="M38 10v8M38 58v8M10 38h8M58 38h8M18 18l6 6M52 52l6 6M58 18l-6 6M24 52l-6 6" stroke="#166534" stroke-width="3.2" stroke-linecap="round"/></g><g transform="translate(114, 88)"><circle cx="24" cy="24" r="15" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.8"/><circle cx="24" cy="24" r="5" fill="#0D9488"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6" stroke="#0D9488" stroke-width="2.8" stroke-linecap="round"/></g></svg>'
      };

      const path = window.location.pathname || '/unknown-path';
      const STATES = {
        '404': {
          code: '404',
          badge: 'HTTP_STATUS: 404_NOT_FOUND',
          dotClass: '',
          title: 'Halaman Tidak Ditemukan',
          desc: 'Halaman atau alamat yang Anda tuju tidak tersedia atau telah dipindahkan.',
          cmd: 'GET ' + path + ' — 404 Not Found'
        },
        '403': {
          code: '403',
          badge: 'HTTP_STATUS: 403_FORBIDDEN',
          dotClass: 'warning',
          title: 'Akses Dibatasi',
          desc: 'Anda belum memiliki izin akses untuk membuka halaman ini. Silakan kembali ke beranda.',
          cmd: 'GET ' + path + ' — 403 Forbidden'
        },
        '500': {
          code: '500',
          badge: 'HTTP_STATUS: 500_INTERNAL_ERROR',
          dotClass: 'danger',
          title: 'Terjadi Kendala Sistem',
          desc: 'Terjadi gangguan saat memuat data. Periksa koneksi Anda atau coba muat ulang halaman.',
          cmd: 'ERR ' + path + ' — 500 Internal Server Error'
        },
        '503': {
          code: '503',
          badge: 'HTTP_STATUS: 503_MAINTENANCE',
          dotClass: 'warning',
          title: 'Layanan Sedang Sibuk',
          desc: 'Layanan sedang dalam pemeliharaan sementara. Silakan coba beberapa saat lagi.',
          cmd: 'SVC ' + path + ' — 503 Service Unavailable'
        }
      };

      function switchState(key) {
        const s = STATES[key] || STATES['404'];
        const dot = document.getElementById('ep-dot');
        dot.className = 'status-dot' + (s.dotClass ? ' ' + s.dotClass : '');
        document.getElementById('ep-badge').textContent = s.badge;
        document.getElementById('ep-illustration').innerHTML = ILLUSTRATIONS[s.code];
        document.getElementById('ep-code').textContent = s.code;
        document.getElementById('ep-title').textContent = s.title;
        document.getElementById('ep-desc').textContent = s.desc;
        document.getElementById('ep-cmd').textContent = s.cmd;
        document.getElementById('footerStatus').textContent = 'STATUS: ' + s.code;
        document.title = s.code + ' — ' + s.title + ' | Think Aset';
        document.querySelectorAll('[data-err-mode]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.errMode === s.code);
        });
      }

      document.querySelectorAll('[data-err-mode]').forEach(btn => {
        btn.addEventListener('click', () => switchState(btn.dataset.errMode));
      });

      document.getElementById('ep-back')?.addEventListener('click', () => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = basePath + 'index.html';
      });

      document.getElementById('ep-copy')?.addEventListener('click', async () => {
        const text = document.getElementById('ep-cmd')?.textContent || '';
        try {
          await navigator.clipboard?.writeText(text);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        const btn = document.getElementById('ep-copy');
        if (btn) {
          btn.textContent = 'Tersalin!';
          setTimeout(() => { btn.textContent = 'Salin'; }, 1800);
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === '1' || e.key === 'F1') { if (e.key === 'F1') e.preventDefault(); switchState('404'); }
        else if (e.key === '2' || e.key === 'F2') { if (e.key === 'F2') e.preventDefault(); switchState('403'); }
        else if (e.key === '3' || e.key === 'F3') { if (e.key === 'F3') e.preventDefault(); switchState('500'); }
        else if (e.key === '4' || e.key === 'F4') { if (e.key === 'F4') e.preventDefault(); switchState('503'); }
      });

      const params = new URLSearchParams(window.location.search);
      const qCode = params.get('code');
      switchState(STATES[qCode] ? qCode : '404');
    })();
  </script>
</body>
</html>
