    <style>
        /* ThinkPad Matte Black & Carbon Fiber Aesthetic */
        :root {
            --glitch-color-1: #e60012;
            --glitch-color-2: #0066cc;
        }

        body {
            background-color: #0b0b0d;
            color: #f4f4f5;
            overflow-x: hidden;
        }

        /* Subtle Carbon Fiber Weave + Matte Magnesium Chassis Texture */
        .bg-thinkpad-carbon {
            background-color: #0e0e11;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(230, 0, 18, 0.12) 0%, transparent 55%),
                linear-gradient(27deg, #121216 5px, transparent 5px),
                linear-gradient(207deg, #121216 5px, transparent 5px),
                linear-gradient(27deg, #17171c 5px, transparent 5px),
                linear-gradient(207deg, #17171c 5px, transparent 5px),
                linear-gradient(90deg, #0d0d10 10px, transparent 10px),
                linear-gradient(#121216 25%, #0e0e11 25%, #0e0e11 50%, transparent 50%, transparent 75%, #16161b 75%, #16161b);
            background-size: 100% 100%, 20px 20px, 20px 20px, 20px 20px, 20px 20px, 20px 20px, 20px 20px;
            background-position: 0 0, 0 5px, 10px 0, 0 10px, 10px 5px, 0 0, 0 0;
        }

        /* Subtle CRT / ThinkPad LCD Scanlines */
        .scanlines::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%);
            background-size: 100% 4px;
            z-index: 40;
            pointer-events: none;
        }

        /* TrackPoint Red Cap Rubber Dome Texture */
        .trackpoint-cap {
            background: radial-gradient(circle at 35% 35%, #ff3b47 0%, #e60012 55%, #99000c 100%);
            background-image: radial-gradient(#7a0009 18%, transparent 19%),
                              radial-gradient(#7a0009 18%, transparent 19%);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            box-shadow: 0 0 18px rgba(230, 0, 18, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.4);
        }

        /* ThinkPad Glowing Red i-Dot */
        @keyframes redDotPulse {
            0%, 100% { box-shadow: 0 0 8px #e60012, 0 0 16px #e60012; opacity: 1; }
            50% { box-shadow: 0 0 3px #e60012, 0 0 6px #e60012; opacity: 0.65; }
        }
        .think-red-dot {
            animation: redDotPulse 2.4s infinite ease-in-out;
        }

        /* Glitch Text Animation */
        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }

        .glitch {
            position: relative;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            user-select: none;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch::before {
            left: 3px;
            text-shadow: -2px 0 var(--glitch-color-1);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -3px;
            text-shadow: -2px 0 var(--glitch-color-2);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(15px, 9999px, 81px, 0); transform: skew(0.3deg); }
            10% { clip: rect(92px, 9999px, 14px, 0); transform: skew(0.1deg); }
            20% { clip: rect(45px, 9999px, 128px, 0); transform: skew(-0.4deg); }
            30% { clip: rect(5px, 9999px, 66px, 0); transform: skew(0.2deg); }
            40% { clip: rect(112px, 9999px, 39px, 0); transform: skew(-0.2deg); }
            50% { clip: rect(63px, 9999px, 102px, 0); transform: skew(0.5deg); }
            60% { clip: rect(28px, 9999px, 7px, 0); transform: skew(0.1deg); }
            70% { clip: rect(88px, 9999px, 145px, 0); transform: skew(-0.3deg); }
            80% { clip: rect(12px, 9999px, 53px, 0); transform: skew(0.2deg); }
            90% { clip: rect(74px, 9999px, 23px, 0); transform: skew(-0.5deg); }
            100% { clip: rect(38px, 9999px, 119px, 0); transform: skew(0.1deg); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 100px, 0); transform: skew(-0.2deg); }
            15% { clip: rect(12px, 9999px, 58px, 0); transform: skew(0.4deg); }
            30% { clip: rect(108px, 9999px, 24px, 0); transform: skew(-0.1deg); }
            45% { clip: rect(34px, 9999px, 134px, 0); transform: skew(0.3deg); }
            60% { clip: rect(82px, 9999px, 47px, 0); transform: skew(-0.4deg); }
            75% { clip: rect(19px, 9999px, 91px, 0); transform: skew(0.2deg); }
            90% { clip: rect(122px, 9999px, 11px, 0); transform: skew(-0.3deg); }
            100% { clip: rect(51px, 9999px, 76px, 0); transform: skew(0.1deg); }
        }

        /* Floating Animation */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .animate-float {
            animation: floatSlow 5s ease-in-out infinite;
        }

        /* Animasi Khusus Karakter Santri & Kitab Turats */
        @keyframes tearDropLeft {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translateY(28px) scale(1.1); opacity: 0; }
        }
        @keyframes tearDropRight {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translateY(28px) scale(1.1); opacity: 0; }
        }
        .animate-tear-1 { animation: tearDropLeft 1.2s infinite ease-in; }
        .animate-tear-2 { animation: tearDropRight 1.2s infinite ease-in 0.6s; }

        @keyframes sobShake {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .animate-sob { animation: sobShake 0.45s infinite ease-in-out; }

        @keyframes sadSigh {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(4px) rotate(-1.5deg); }
        }
        .animate-sigh { animation: sadSigh 3.2s infinite ease-in-out; }

        @keyframes sleepyNod {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            65% { transform: rotate(14deg) translateY(9px); }
            75% { transform: rotate(-4deg) translateY(-2px); }
        }
        .animate-nod {
            transform-origin: 100px 125px;
            animation: sleepyNod 3.5s infinite ease-in-out;
        }

        @keyframes zzzFloat {
            0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
            40% { opacity: 1; }
            100% { transform: translate(18px, -28px) scale(1.25); opacity: 0; }
        }
        .animate-zzz-1 { animation: zzzFloat 2.4s infinite linear; }
        .animate-zzz-2 { animation: zzzFloat 2.4s infinite linear 0.8s; }
        .animate-zzz-3 { animation: zzzFloat 2.4s infinite linear 1.6s; }

        @keyframes kitabHover {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }
        .animate-kitab { animation: kitabHover 3s infinite ease-in-out; }

        @keyframes fadePulse {
            0%, 100% { opacity: 0.15; }
            50% { opacity: 0.55; }
        }
        .animate-blank-page { animation: fadePulse 2s infinite ease-in-out; }

        @keyframes breatheSoft {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        .animate-breathe { animation: breatheSoft 3.5s infinite ease-in-out; }

        /* Cursor Blink */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>

        /* ==========================================================================
           1. ERROR STATE CONFIGURATION
           ========================================================================== */
        const errorStates = {
            '403': {
                code: '403',
                badge: 'HTTP_STATUS: 403_FORBIDDEN',
                title: 'Akses Ditolak',
                desc: 'Maaf, Anda belum memiliki izin akses untuk membuka halaman khusus ini. Silakan kembali ke beranda.',
                cmd: `GET ${window.location.pathname || '/restricted'} HTTP/1.1 — 403 Forbidden`,
                color1: '#e60012',
                color2: '#eab308',
                badgeClass: 'text-amber-400',
                dotClass: 'bg-amber-400',
                btnActiveClass: 'bg-[#e60012]/20 text-white border-[#e60012]'
            },
            '404': {
                code: '404',
                badge: 'HTTP_STATUS: 404_NOT_FOUND',
                title: 'Halaman Tidak Ditemukan',
                desc: 'Halaman yang Anda tuju tidak tersedia atau telah dipindahkan.',
                cmd: `GET ${window.location.pathname || '/unknown-path'} HTTP/1.1 — 404 Not Found`,
                color1: '#e60012',
                color2: '#0066cc',
                badgeClass: 'text-red-400',
                dotClass: 'bg-[#e60012]',
                btnActiveClass: 'bg-[#e60012]/20 text-white border-[#e60012]'
            },
            '500': {
                code: '500',
                badge: 'HTTP_STATUS: 500_INTERNAL_SERVER_ERROR',
                title: 'Server Eror',
                desc: 'Terjadi kendala internal pada sistem! Halaman terbuka namun data gagal dimuat.',
                cmd: 'HTTP/1.1 500 Internal Server Error',
                color1: '#e60012',
                color2: '#a855f7',
                badgeClass: 'text-red-400',
                dotClass: 'bg-[#e60012]',
                btnActiveClass: 'bg-[#e60012]/20 text-white border-[#e60012]'
            },
            '503': {
                code: '503',
                badge: 'HTTP_STATUS: 503_SERVICE_UNAVAILABLE',
                title: 'Sedang Sibuk',
                desc: 'Layanan sedang dalam pemeliharaan sementara. Silakan coba beberapa saat lagi.',
                cmd: 'HTTP/1.1 503 Service Unavailable (Retry-After: 3600)',
                color1: '#0066cc',
                color2: '#e60012',
                badgeClass: 'text-sky-400',
                dotClass: 'bg-sky-400',
                btnActiveClass: 'bg-[#0066cc]/25 text-white border-[#0066cc]'
            }
        };

        function switchErrorState(stateKey) {
            const state = errorStates[stateKey];
            if (!state) return;

            const stageEl = document.getElementById('illustrationStage');
            if (stageEl && santriIllustrations[stateKey]) {
                stageEl.innerHTML = santriIllustrations[stateKey];
            }

            const glitchEl = document.getElementById('glitchNumber');
            glitchEl.textContent = state.code;
            glitchEl.setAttribute('data-text', state.code);

            document.documentElement.style.setProperty('--glitch-color-1', state.color1);
            document.documentElement.style.setProperty('--glitch-color-2', state.color2);

            document.getElementById('errorCodeBadge').textContent = state.badge;
            document.getElementById('errorCodeBadge').className = `${state.badgeClass} font-bold tracking-wider text-[11px] sm:text-xs`;
            document.getElementById('statusDot').className = `animate-ping absolute inline-flex h-full w-full rounded-full ${state.dotClass} opacity-75`;
            document.getElementById('statusDotSolid').className = `relative inline-flex rounded-full h-2 w-2 ${state.dotClass}`;

            document.getElementById('errorTitle').textContent = state.title;
            document.getElementById('errorDesc').textContent = state.desc;
            document.getElementById('diagnosticCommand').textContent = state.cmd;
            document.getElementById('footerStatus').textContent = `STATUS: ${state.code}`;
            document.title = `${state.code} — ${state.title} | Think Aset`;

            document.querySelectorAll('.err-tab').forEach(btn => {
                btn.className = 'err-tab px-3.5 py-1.5 rounded-lg text-xs font-mono font-semibold text-zinc-400 hover:text-white bg-[#1c1c21] transition-all border border-[#2e2e36]';
            });
            const activeBtn = document.getElementById(`btn-${stateKey}`);
            if (activeBtn) {
                activeBtn.className = `err-tab px-3.5 py-1.5 rounded-lg text-xs font-mono font-semibold transition-all border shadow-[inset_0_1px_0_rgba(255,255,255,0.2)] ${state.btnActiveClass}`;
            }
        }

        // Keyboard Shortcut F1-F4 atau Angka 1-4 untuk berpindah mode ala ThinkPad
        document.addEventListener('keydown', (e) => {
            if (e.key === '1' || e.key === 'F1') { if (e.key === 'F1') e.preventDefault(); switchErrorState('404'); }
            if (e.key === '2' || e.key === 'F2') { if (e.key === 'F2') e.preventDefault(); switchErrorState('403'); }
            if (e.key === '3' || e.key === 'F3') { if (e.key === 'F3') e.preventDefault(); switchErrorState('500'); }
            if (e.key === '4' || e.key === 'F4') { if (e.key === 'F4') e.preventDefault(); switchErrorState('503'); }
        });

        /* ==========================================================================
           2. CLIPBOARD DIAGNOSTIC COPY
           ========================================================================== */
        async function copyDiagnostic() {
            const cmdText = document.getElementById('diagnosticCommand').textContent;
            let copied = false;
            try {
                if (navigator.clipboard?.writeText) {
                    await navigator.clipboard.writeText(cmdText);
                    copied = true;
                }
            } catch {}
            if (!copied) {
                const tempInput = document.createElement('textarea');
                tempInput.value = cmdText;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
            }

            const copyIcon = document.getElementById('copyIcon');
            const copyText = document.getElementById('copyText');
            copyIcon.className = 'fa-solid fa-check text-green-400';
            copyText.textContent = 'Tersalin!';
            setTimeout(() => {
                copyIcon.className = 'fa-regular fa-copy';
                copyText.textContent = 'Salin';
            }, 2000);
        }

        /* ==========================================================================
           3. 3D MOUSE PARALLAX & INTERACTIVE PARTICLE NETWORK
           ========================================================================== */
        const parallaxContainer = document.getElementById('parallaxContainer');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 35;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 35;
            if (parallaxContainer) {
                parallaxContainer.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });

        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.radius = Math.random() * 1.5 + 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(230, 0, 18, 0.35)';
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(Math.floor(window.innerWidth / 25), 55);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(230, 0, 18, ${0.12 * (1 - dist / 120)})`;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        window.onload = function () {
            resizeCanvas();
            initParticles();
            animateParticles();
            const params = new URLSearchParams(window.location.search);
            const qCode = params.get('code');
            switchErrorState(errorStates[qCode] ? qCode : '404');
        };
    </script>
